# DataForge default pipeline: English + Urdu, FineWeb-Edu-style filtering.
run_name: default
inputs:
  - data/samples/corpus.jsonl
  - data/samples/cc_sample.warc.gz
  - data/samples/cc_sample.wet
  - data/samples/html
output_dir: outputs/default
seed: 42

extract:
  backend: builtin          # builtin | trafilatura
  min_chars: 50

lang:
  backend: heuristic        # heuristic | langdetect | fasttext
  fasttext_model: null      # path to lid.176.bin / GlotLID model.bin when backend=fasttext
  keep: [en, ur]
  min_score: 0.5

heuristics:
  enabled: true
  min_words: 25
  max_words: 100000
  min_mean_word_len: 2.0
  max_mean_word_len: 12.0
  max_symbol_word_ratio: 0.1
  max_bullet_line_frac: 0.9
  max_ellipsis_line_frac: 0.3
  max_dup_line_frac: 0.3
  max_top_bigram_char_frac: 0.2
  # Gopher uses 0.8; that silently removes ~41% of math-heavy educational docs in the
  # sample corpus (numbers are not "alphabetic words"). 0.6 removes 0% of them.
  min_alpha_word_frac: 0.6
  max_uppercase_frac: 0.3
  max_exclamation_per_100_words: 3.0
  min_stopwords: 2

dedup:
  exact: true
  near: true
  mode: streaming           # streaming | mapreduce
  threshold: 0.7            # Jaccard over word 5-gram shingles
  num_perm: 128
  ngram: 5
  char_level: false
  verify: minhash           # minhash | exact
  workers: 1                # >1 enables parallel signature computation
  parallel_backend: multiprocessing   # multiprocessing | ray
  backend: python           # python | datasketch

quality:
  enabled: true
  model_path: models/edu_quality.pkl
  train_data: data/samples/quality_train.jsonl
  # Keep docs whose predicted edu score >= threshold. 2.5 == FineWeb-Edu's int_score >= 3.
  thresholds:
    default: 2.5

safety:
  pii:
    enabled: true
    actions:
      EMAIL: redact
      PHONE: redact
      CNIC: redact
      CREDIT_CARD: redact
      IBAN: redact
      IP_ADDRESS: redact
      PERSON: flag
    max_pii_per_100_words: 5.0
    enable_names: true
  toxicity:
    enabled: true
    action: drop            # drop | redact_sentences | flag | keep
    threshold: 0.5
    classifier_path: null
    lexicon_path: null

export:
  formats: [jsonl, parquet]
  write_rejected: true
  by_language: true
  drop_gold: true
